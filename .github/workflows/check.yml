name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            system-features = nixos-test benchmark big-parallel kvm
      - uses: nix-community/cache-nix-action@v7
        with:
          # Hash the whole tree (e.g. .github/**), not just *.nix/flake.lock,
          # since .nix files can reference non-.nix content (facter.json,
          # sops secrets files) whose changes must also bust the cache.
          # hashFiles() matches dotfiles by default (@actions/glob's
          # excludeHiddenFiles defaults to false) -- only .git is excluded.
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**', '!.git/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 9G
      - run: nix flake check
      # Root everything nix flake check just built so the post-job garbage
      # collection (below) doesn't sweep it before the cache is saved --
      # nix flake check itself leaves no lasting GC root. See
      # modules/save-from-gc.nix.
      - run: nix build .#saveFromGC
