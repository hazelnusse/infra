name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true
      - uses: nix-community/cache-nix-action@v7
        with:
          # Hash the whole tree (e.g. .github/**), not just *.nix/flake.lock,
          # since .nix files can reference non-.nix content (facter.json,
          # sops secrets files) whose changes must also bust the cache.
          # hashFiles() matches dotfiles by default (@actions/glob's
          # excludeHiddenFiles defaults to false) -- only .git is excluded.
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**', '!.git/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 9G
      - run: nix flake check
